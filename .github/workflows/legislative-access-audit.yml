name: Public legislative access audit
on:
  push:
    branches: ['main', 'audit/legislative-cloud-2026-11-16']
    paths: ['legislation-audit/**', '.github/workflows/legislative-access-audit.yml']
  workflow_dispatch:
  public:
permissions:
  contents: read
jobs:
  anonymous-access:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public test dependencies
        run: |
          python -m pip install playwright==1.56.0 pypdf==6.1.3
          python -m playwright install --with-deps chromium
      - name: Test fresh anonymous browser and FTP access
        run: python legislation-audit/runner.py
      - name: Publish compact audit result to job log
        if: always()
        run: |
          if [ -f audit-results/result.json ]; then cat audit-results/result.json; fi

